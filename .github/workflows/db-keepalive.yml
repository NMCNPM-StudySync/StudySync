name: Supabase Database Keepalive

on:
  schedule:
    # Chạy vào 04:00 UTC (11:00 giờ Việt Nam) các ngày Thứ Hai, Thứ Tư, Thứ Sáu và Chủ Nhật
    - cron: '0 4 * * 1,3,5,0'
  workflow_dispatch:

jobs:
  ping-database:
    name: Ping Supabase Database (Chống Auto-pause 7 ngày)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run keepalive query
        run: |
          node -e "
          const { Pool } = require('pg');
          const dbUrl = process.env.DATABASE_URL || process.env.DIRECT_URL;

          if (!dbUrl) {
            console.log('Chưa cấu hình biến bí mật DATABASE_URL trên GitHub Secrets. Bỏ qua ping tự động.');
            process.exit(0);
          }

          const pool = new Pool({
            connectionString: dbUrl,
            ssl: { rejectUnauthorized: false }
          });

          pool.query('SELECT 1 AS keepalive')
            .then(res => {
              console.log('Keepalive query thành công:', res.rows);
              return pool.end();
            })
            .catch(err => {
              console.error('Lỗi khi thực thi keepalive query:', err.message);
              return pool.end().then(() => process.exit(1));
            });
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
